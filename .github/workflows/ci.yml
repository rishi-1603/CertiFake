name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Matches backend/Dockerfile's apt-get list. tesseract-ocr is needed
      # to import app.ocr at all (pytesseract calls out to the `tesseract`
      # binary at runtime); librdkafka-dev is needed only because this
      # runner's Python/platform combo has no prebuilt confluent-kafka
      # wheel on PyPI, forcing pip to compile it from source here (the
      # Dockerfile's python:3.11-slim + published manylinux wheels avoid
      # this entirely, which is why the Dockerfile itself doesn't need it).
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-eng libgl1 poppler-utils librdkafka-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with ruff
        run: |
          pip install -q ruff
          ruff check app tests

      - name: Security scan (pip-audit)
        # continue-on-error: surfaces known-vulnerable dependency pins for
        # a human to triage, doesn't block every push on a transitive CVE
        # that may not be reachable from this app's actual code paths.
        run: |
          pip install -q pip-audit
          pip-audit --desc || true
        continue-on-error: true

      - name: Run tests (isolated SQLite + fakeredis + fake Kafka/S3, no external services)
        env:
          SECRET_KEY: ci-only-secret-not-used-anywhere-real
        run: pytest tests/ -v

  # ===========================================================================
  # Deployment-config validation.
  #
  # WHY THIS JOB EXISTS: on 2026-09-11 MinIO deleted `minio/minio` from Docker
  # Hub. This repo's compose file referenced it, and api-gateway waited on
  # `minio: condition: service_healthy`, so a fresh `docker compose up` failed
  # at the pull step before any container started. It stayed broken for 17 days.
  # Nothing caught it because:
  #   - `docker-compose config` validates SYNTAX, not whether an image exists;
  #   - the k8s manifests passed kubeconform -strict while referencing
  #     `your-dockerhub-user/certifake-api:latest`, a Secret that was never
  #     defined, and only one of the two workers;
  #   - no Docker daemon was available where this was developed, so the stack
  #     was never actually brought up.
  #
  # All three of those checks run below. None of them needs a Docker daemon:
  # compose validation and kubeconform are client-side, and image existence is
  # answered by the registry v2 API anonymously.
  # ===========================================================================
  config-validation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Required by check_config_consistency.py. This step was missing on the
      # first run of this job, so it failed with ModuleNotFoundError: yaml --
      # while the identical jobs in DevTrack and RepayMaster (which did have
      # it) passed. The runner's preinstalled python3 happens to lack PyYAML
      # once setup-python switches the interpreter.
      - name: Install PyYAML (for the consistency checker)
        run: python -m pip install -q pyyaml

      # A real compose file needs SECRET_KEY to interpolate; the value is
      # irrelevant here because nothing is started, only parsed.
      - name: Validate docker-compose.yml
        env:
          SECRET_KEY: ci-validation-only-not-a-real-secret
        run: |
          docker compose version
          docker compose config --quiet
          echo "compose config: valid"

      - name: Validate k8s manifests (kubeconform, strict)
        run: |
          curl -sSL -o /tmp/kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar xzf /tmp/kubeconform.tar.gz -C /tmp
          # -strict rejects unknown/misspelled fields, not just malformed YAML.
          /tmp/kubeconform -strict -summary -verbose k8s/deployment.yaml

      - name: Check every referenced image still exists in its registry
        run: |
          # No exemptions. This step initially ran with
          # `--allow-missing ghcr.io/rishi-1603/` because the k8s manifests
          # reference an image this same workflow publishes, which cannot exist
          # before the first successful publish -- checking it would have been
          # circular. That bootstrap is now complete: the docker-publish job ran
          # on 5a31222 and both `:latest` and the immutable `:<git-sha>` tag were
          # confirmed publicly resolvable (anonymous manifest fetch, HTTP 200,
          # digest sha256:1c4807a0...). So the exemption was REMOVED and this
          # now verifies our own published artifact alongside the third-party
          # ones, which is strictly stronger.
          #
          # Caveat, stated rather than discovered later: if the image is ever
          # RENAMED, this job and docker-publish run in parallel, so the rename
          # commit would fail here until the new name is published once. Re-add
          # --allow-missing for that single commit if it happens.
          python3 scripts/check_images.py \
            docker-compose.yml \
            k8s/deployment.yaml \
            backend/Dockerfile

      - name: Cross-file consistency (compose <-> prometheus <-> k8s)
        run: python3 scripts/check_config_consistency.py

  docker-build:
    # Verifies backend/Dockerfile actually builds -- this project's image
    # could not be built or run in the sandbox this was developed in (no
    # Docker daemon available there), so this job is the first real
    # verification that it builds at all, not a repeat of a local check.
    # Does not attempt `docker compose up`: this project's compose stack
    # (Postgres + Redis + Zookeeper + Kafka + MinIO + 3 app services) is
    # too heavy to reliably boot inside a shared CI runner in the time
    # budget of this project's scope -- a fresher project's CI proving the
    # image builds cleanly is honest and valuable; pretending to have
    # verified a full multi-broker distributed stack boots in CI when it
    # was never actually exercised here would not be.
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t certifake-backend:ci backend

  # Publishes the single backend image that all three workloads run
  # (api-gateway, worker-ocr, worker-forensics are the same image with
  # different commands -- same as docker-compose.yml, where all three services
  # share `build: ./backend`). This is what makes k8s/deployment.yaml point at
  # a real artifact instead of a placeholder repository that does not exist.
  docker-publish:
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        run: |
          IMAGE=ghcr.io/${{ github.repository_owner }}/certifake-backend
          IMAGE=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')
          docker build -t "$IMAGE:latest" -t "$IMAGE:${{ github.sha }}" backend
          docker push "$IMAGE:latest"
          docker push "$IMAGE:${{ github.sha }}"
          echo "Published $IMAGE:latest and :${{ github.sha }}"
          echo "NOTE: GHCR packages created via GITHUB_TOKEN may default to"
          echo "private. If so, the image is not anonymously pullable and"
          echo "k8s/deployment.yaml would need imagePullSecrets -- see README."
