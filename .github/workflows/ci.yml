name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Matches backend/Dockerfile's apt-get list. tesseract-ocr is needed
      # to import app.ocr at all (pytesseract calls out to the `tesseract`
      # binary at runtime); librdkafka-dev is needed only because this
      # runner's Python/platform combo has no prebuilt confluent-kafka
      # wheel on PyPI, forcing pip to compile it from source here (the
      # Dockerfile's python:3.11-slim + published manylinux wheels avoid
      # this entirely, which is why the Dockerfile itself doesn't need it).
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-eng libgl1 poppler-utils librdkafka-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with ruff
        # Pinned (Day-7, finding S13): this installed whatever ruff was newest,
        # so an upstream lint-rule change could turn a green build red with no
        # commit in this repo. Verified locally that 0.16.9 passes app + tests.
        run: |
          pip install -q ruff==0.16.9
          ruff check app tests

      - name: Security scan (pip-audit)
        # Day-7 remediation (finding S3): this step used to be
        #   pip-audit --desc || true
        # together with continue-on-error -- non-blocking twice over, so the
        # last green build before this change printed "Found 77 known
        # vulnerabilities in 10 packages" and still reported success. That is
        # how pillow 11.0.0 (19 advisories, reachable because Image.open() runs
        # on attacker-supplied uploads), python-multipart 0.0.20 (reachable
        # through the upload endpoints) and an unmaintained python-jose survived
        # in a repo that claims security work.
        #
        # The pins have been bumped and the dead dependencies removed until the
        # scan is genuinely clean -- verified both against the installed
        # environment and against `pip-audit -r requirements.txt`, so the
        # resolution CI performs is the one that was checked. Zero waivers.
        #
        # If a future advisory has no available fix, do NOT re-add `|| true`.
        # Use `--ignore-vuln <ID>` with a comment saying why it is not reachable
        # from this app's code paths and the date to re-review, so the waiver is
        # visible here rather than buried in a log nobody reads.
        #
        # pip is upgraded again (the install step already did) to keep this step
        # self-contained if reordered: pip-audit audits the whole environment,
        # and an outdated installer itself trips PYSEC-2026-3721.
        run: |
          python -m pip install --upgrade pip
          pip install -q pip-audit
          pip-audit --desc

      - name: Run tests (isolated SQLite + fakeredis + fake Kafka/S3, no external services)
        env:
          SECRET_KEY: ci-only-secret-not-used-anywhere-real
        # --cov added Day 7: coverage for this repo was previously unmeasured,
        # so no percentage was quotable (and none was quoted). term-missing
        # keeps the gaps visible in the log instead of hiding behind a total.
        run: pytest tests/ -v --cov=app --cov-report=term-missing

  # ===========================================================================
  # Deployment-config validation.
  #
  # WHY THIS JOB EXISTS: on 2026-09-11 MinIO deleted `minio/minio` from Docker
  # Hub. This repo's compose file referenced it, and api-gateway waited on
  # `minio: condition: service_healthy`, so a fresh `docker compose up` failed
  # at the pull step before any container started. It stayed broken for 17 days.
  # Nothing caught it because:
  #   - `docker-compose config` validates SYNTAX, not whether an image exists;
  #   - the k8s manifests passed kubeconform -strict while referencing
  #     `your-dockerhub-user/certifake-api:latest`, a Secret that was never
  #     defined, and only one of the two workers;
  #   - no Docker daemon was available where this was developed, so the stack
  #     was never actually brought up.
  #
  # All three of those checks run below. None of them needs a Docker daemon:
  # compose validation and kubeconform are client-side, and image existence is
  # answered by the registry v2 API anonymously.
  # ===========================================================================
  config-validation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Required by check_config_consistency.py. This step was missing on the
      # first run of this job, so it failed with ModuleNotFoundError: yaml --
      # while the identical jobs in DevTrack and RepayMaster (which did have
      # it) passed. The runner's preinstalled python3 happens to lack PyYAML
      # once setup-python switches the interpreter.
      - name: Install PyYAML (for the consistency checker)
        run: python -m pip install -q pyyaml

      # A real compose file needs SECRET_KEY to interpolate; the value is
      # irrelevant here because nothing is started, only parsed.
      - name: Validate docker-compose.yml
        env:
          SECRET_KEY: ci-validation-only-not-a-real-secret
        run: |
          docker compose version
          docker compose config --quiet
          echo "compose config: valid"

      - name: Validate k8s manifests (kubeconform, strict)
        run: |
          curl -sSL -o /tmp/kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar xzf /tmp/kubeconform.tar.gz -C /tmp
          # -strict rejects unknown/misspelled fields, not just malformed YAML.
          /tmp/kubeconform -strict -summary -verbose k8s/deployment.yaml

      - name: Check every referenced image still exists in its registry
        run: |
          # No exemptions. This step initially ran with
          # `--allow-missing ghcr.io/rishi-1603/` because the k8s manifests
          # reference an image this same workflow publishes, which cannot exist
          # before the first successful publish -- checking it would have been
          # circular. That bootstrap is now complete: the docker-publish job ran
          # on 5a31222 and both `:latest` and the immutable `:<git-sha>` tag were
          # confirmed publicly resolvable (anonymous manifest fetch, HTTP 200,
          # digest sha256:1c4807a0...). So the exemption was REMOVED and this
          # now verifies our own published artifact alongside the third-party
          # ones, which is strictly stronger.
          #
          # Caveat, stated rather than discovered later: if the image is ever
          # RENAMED, this job and docker-publish run in parallel, so the rename
          # commit would fail here until the new name is published once. Re-add
          # --allow-missing for that single commit if it happens.
          python3 scripts/check_images.py \
            docker-compose.yml \
            k8s/deployment.yaml \
            backend/Dockerfile

      - name: Cross-file consistency (compose <-> prometheus <-> k8s)
        run: python3 scripts/check_config_consistency.py

  docker-build:
    # Verifies backend/Dockerfile actually builds -- this project's image
    # could not be built or run in the sandbox this was developed in (no
    # Docker daemon available there), so this job is the first real
    # verification that it builds at all, not a repeat of a local check.
    #
    # Booting the full stack is compose-smoke-test's job (below). This comment
    # used to say the stack was "too heavy to reliably boot inside a shared CI
    # runner" and that attempting it was out of scope. That was a prediction,
    # not a measurement -- so it is now measured, and the prediction stands or
    # falls on that job's result rather than on an assumption.
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t certifake-backend:ci backend

  # ===========================================================================
  # Boots the REAL 10-service stack and drives one genuine request through it.
  #
  # WHY THIS JOB EXISTS: every other job in this workflow checks a PART. The
  # unit tests fake Kafka and S3 at the Python-call boundary; config-validation
  # parses YAML and resolves image references; docker-build compiles an image.
  # Until now nothing anywhere had ever run `docker compose up` on this stack,
  # so the entire distributed path -- does the worker actually consume the
  # topic, do the MinIO credentials match, does tesseract have its language
  # data in the image, can api-gateway reach postgres by service name -- was
  # untested. A green suite can coexist with a stack that never worked.
  #
  # `up --wait` blocks until every healthchecked service reports healthy, so
  # this also empirically validates the healthchecks added earlier (which were
  # only ever verified by inspecting image layer tarballs for the binaries they
  # name). zookeeper/kafka/prometheus/grafana have no healthchecks -- see the
  # note on api-gateway's depends_on in docker-compose.yml for why Kafka is
  # deliberately not gated -- so --wait does not block on them; the smoke test
  # retries /analyze through the documented 503-while-Kafka-elects window.
  #
  # The smoke test runs INSIDE api-gateway so it needs no runner dependencies:
  # it uses the app image's own Pillow to render the certificate and stdlib
  # urllib for HTTP. See scripts/compose_smoke_test.py for what it asserts.
  # ===========================================================================
  compose-smoke-test:
    runs-on: ubuntu-latest
    needs: docker-build
    # Pulling confluentinc/cp-kafka + cp-zookeeper + grafana + prometheus and
    # waiting for Kafka to elect a broker is minutes, not seconds.
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Same throwaway value pattern as config-validation: the compose file
      # requires SECRET_KEY to interpolate (`${SECRET_KEY:?...}`), and the app
      # deliberately has no safe hardcoded default so that a missing secret is
      # loud. Nothing here is a real credential.
      - name: Boot the stack and wait for all healthchecks
        env:
          SECRET_KEY: ci-smoke-only-not-a-real-secret
        run: |
          docker compose version
          docker compose up -d --build --wait --wait-timeout 900

      # Recorded whether or not the smoke test passes: a service that is up but
      # unhealthy (or restarting) is exactly the failure mode the healthchecks
      # exist to surface, and this is the only place it is visible.
      - name: Report container states
        if: always()
        env:
          SECRET_KEY: ci-smoke-only-not-a-real-secret
        run: docker compose ps -a

      - name: Run the end-to-end smoke test inside api-gateway
        env:
          SECRET_KEY: ci-smoke-only-not-a-real-secret
        run: docker compose exec -T api-gateway python - < scripts/compose_smoke_test.py

      # Only useful when something above failed. This step earned its place on
      # the job's very first run, when the stack had never been booted anywhere:
      # these logs are the only reason the ZooKeeper cgroup-v2 crash was
      # diagnosed as a JVM bug in an old image rather than guessed at.
      - name: Dump service logs on failure
        if: failure()
        env:
          SECRET_KEY: ci-smoke-only-not-a-real-secret
        run: docker compose logs --tail 120

      - name: Tear down (volumes too, so no state leaks between runs)
        if: always()
        env:
          SECRET_KEY: ci-smoke-only-not-a-real-secret
        run: docker compose down -v --remove-orphans --timeout 30

  # Publishes the single backend image that all three workloads run
  # (api-gateway, worker-ocr, worker-forensics are the same image with
  # different commands -- same as docker-compose.yml, where all three services
  # share `build: ./backend`). This is what makes k8s/deployment.yaml point at
  # a real artifact instead of a placeholder repository that does not exist.
  # ===========================================================================
  # Builds and lints the React frontend. Until this job existed, NOTHING had
  # ever compiled frontend/: no CI job referenced it, there is no test suite for
  # it, and the sandbox it was written in had no node_modules. The backend had
  # four jobs and the compose stack had a boot test, while the one part of the
  # product a human actually sees could have stopped compiling with no signal
  # anywhere.
  #
  # Verified locally before adding (2026-09-30): `npm ci` + `npm run lint` +
  # `npm run build` all succeed -- vite 8.1.4, 16 modules, ~62 kB gzipped JS.
  # The build surfaced exactly one oxlint warning (react-hooks/exhaustive-deps
  # on the heatmap/report effect, missing `authHeaders`), which was fixed by
  # memoizing authHeaders on `token` rather than silenced, so `--deny-warnings`
  # here is a real gate rather than a formality that had to be weakened.
  #
  # Pinned to Node 20 with setup-node because the repo's philosophy elsewhere
  # (pinned base images, pinned apt packages) is that an unpinned toolchain is
  # a failure that arrives later with no commit to blame.
  # ===========================================================================
  frontend-build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies (exact, from the lockfile)
        run: npm ci

      - name: Lint with oxlint (warnings are failures)
        run: npm run lint -- --deny-warnings

      - name: Production build
        run: npm run build

  docker-publish:
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        run: |
          IMAGE=ghcr.io/${{ github.repository_owner }}/certifake-backend
          IMAGE=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')
          docker build -t "$IMAGE:latest" -t "$IMAGE:${{ github.sha }}" backend
          docker push "$IMAGE:latest"
          docker push "$IMAGE:${{ github.sha }}"
          echo "Published $IMAGE:latest and :${{ github.sha }}"
          echo "NOTE: GHCR packages created via GITHUB_TOKEN may default to"
          echo "private. If so, the image is not anonymously pullable and"
          echo "k8s/deployment.yaml would need imagePullSecrets -- see README."
